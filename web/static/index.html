<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKOS Review Agent</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>SKOS Review Agent</h1>
  <p class="sub">AI エージェントの設計を診断するエージェント。自分自身も同じルールで縛られています。</p>
  <p id="mode" class="mode"></p>
</header>
<main>
  <section class="panel" id="setup">
    <h2>1. 診断する MCP 設定</h2>
    <label><input type="radio" name="src" value="sample" checked> サンプル設定（fetch / files / github）</label>
    <label><input type="radio" name="src" value="own"> 自分の設定を貼り付ける（セッション中だけメモリに保持し、ログには残しません。診断用の一時ファイルは診断後すぐ削除。秘密情報の値は結果に出ません）</label>
    <textarea id="config" rows="6" placeholder='{"mcpServers": {...}}' hidden></textarea>
    <h3>エージェントの動かし方</h3>
    <label><input type="radio" name="run" value="live" checked> 本物の Gemini（多くの場合、仕込まれた指示を自分で見抜きます）</label>
    <label><input type="radio" name="run" value="scripted"> 台本モード：もしモデルが騙されたら？（Gemini を呼ばず、仕込みに従ってしまうモデルを再生します）</label>
    <button id="start">セッション開始</button>
  </section>
  <section class="panel" id="chatbox" hidden>
    <h2>2. エージェントに依頼</h2>
    <div class="row">
      <input id="msg" maxlength="4000" value="この MCP 設定のセキュリティ設計をレビューして。必要なら関連する issue も調べて。">
      <button id="send">送信</button>
    </div>
  </section>
  <section class="grid" id="views" hidden>
    <div class="panel">
      <h2>エージェントの行動</h2>
      <p id="runbanner" class="banner" hidden></p>
      <ol id="timeline"></ol>
    </div>
    <div class="panel">
      <h2>ゲートの状態</h2>
      <ul id="gate"></ul>
      <h3>承認待ち</h3>
      <div id="holds"><p class="muted">なし</p></div>
      <h3>送信箱（実際には送信しません）</h3>
      <ul id="outbox"><li class="muted">空</li></ul>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
