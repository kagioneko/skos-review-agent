[project]
name = "skos-review-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["google-adk==2.10.0", "google-cloud-firestore==2.34.0", "security-knowledge-os==0.3.0", "fastapi==0.141.1", "uvicorn==0.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
